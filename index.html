:root{
  --ink:#1d2b33; --muted:#5a6b75; --teal:#1f4e5f; --teal-2:#2c6e84; --amber:#e8a33d; --amber-d:#c9861f;
  --bg:#fbf8f3; --card:#ffffff; --line:#e6dfd3; --soft:#f1ece2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:17px}
img,svg{max-width:100%}
a{color:var(--teal-2)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px;margin:0 auto}
h1,h2,h3{line-height:1.2;color:var(--teal);margin:0 0 .5em}
h1{font-size:clamp(2rem,5.2vw,3.2rem);letter-spacing:-.02em}
h2{font-size:clamp(1.55rem,3.6vw,2.2rem);letter-spacing:-.01em}
h3{font-size:1.15rem}
p{margin:0 0 1em}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-d);margin-bottom:.8em}
section{padding:64px 0}
.alt{background:var(--soft)}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:800;font-size:1.15rem;color:var(--teal);text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--amber-d)}
.btn{display:inline-block;background:var(--amber);color:#2b1d03;font-weight:800;text-decoration:none;padding:16px 28px;border-radius:12px;font-size:1.05rem;box-shadow:0 3px 0 var(--amber-d);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--amber-d)}
.btn.small{padding:10px 18px;font-size:.95rem;border-radius:10px}
.btn.block{display:block;width:100%}
.micro{font-size:.88rem;color:var(--muted);margin-top:.8em}
/* hero */
.hero{padding:56px 0 64px}
.hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
